services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cricket
      POSTGRES_PASSWORD: cricket_dev_password
      POSTGRES_DB: cricket_commentary
    ports: ["5432:5432"]
    volumes: [cricket_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cricket -d cricket_commentary"]
      interval: 5s
      timeout: 3s
      retries: 15
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes: [cricket_redis:/data]
volumes:
  cricket_postgres:
  cricket_redis: